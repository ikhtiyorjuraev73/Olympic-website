<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="auth-container">
    <div class="info">
      <h2>Khiso Olimpiadasi</h2>
      <p>Olimpiadalarda qatnashing, orzular sari yo'l oching!</p>
      <p>Bilimlaringizni sinab ko'ring va o'zingizni kashf eting!</p>
      <p>Har bir sinov – yangi marralarga yo'l!</p>
    </div>
    <form class="form" action="#" method="post">
      <h3>Xush kelibsiz!</h3>
      <div class="form-row">
        <input type="tel" name="phone" placeholder="Telefon" required>
        <input type="password" name="password" placeholder="Parol" required>
      </div>
      <button type="submit" class="primary-btn">Kirish</button>
      <p class="switch">Sizda hali shaxsiy akkaunt yo'qmi? Unda hoziroq <a href="register.html">ro'yxatdan o'ting</a>.</p>
    </form>
  </section>
</body>
</html>
